# Update seats: Actions → Update seats → Run workflow → pick the date, type the seats left (0 = full) → Run.
# A -pm date is the afternoon session: it shows on the page once it has a number here.
name: Update seats

on:
  workflow_dispatch:
    inputs:
      date:
        description: Workshop date (-pm = the afternoon session)
        type: choice
        options:
          - "2026-11-07"
          - "2026-11-08"
          - "2026-11-28"
          - "2026-11-28-pm"
      seats:
        description: Seats left (0 = full)
        type: number
        required: true

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set the seats
        env:
          DATE: ${{ inputs.date }}
          SEATS: ${{ inputs.seats }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          date, seats = os.environ["DATE"], os.environ["SEATS"]
          if not seats.isdigit() or int(seats) > 20:
              sys.exit(f"Seats must be a whole number from 0 to 20, not {seats!r}.")
          with open("seats.json") as f:
              data = json.load(f)
          if date not in data and not date.endswith("-pm"):
              sys.exit(f"{date} is not in seats.json. Add the date to the page first.")
          old = data.get(date, "closed")   # an afternoon session opens the first time it is given a number
          data[date] = int(seats)
          with open("seats.json", "w") as f:
              f.write("{ " + ", ".join(f'"{k}": {v}' for k, v in data.items()) + " }\n")
          print(f"{date}: {old} -> {seats} seats left")
          PY
      - name: Save and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ inputs.date }}
          SEATS: ${{ inputs.seats }}
        run: |
          if git diff --quiet seats.json; then echo "No change: $DATE already has $SEATS seats left."; exit 0; fi
          git config user.name "unwakingart"
          git config user.email "unwakingart@users.noreply.github.com"
          git add seats.json
          C=$(git commit-tree "$(git write-tree)" -m "Page")
          git push --force origin "$C:main"
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "Pages will rebuild on its own."
